[build-system]
requires = ["numpy", "cython>=3.0.5", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "qiskit-addon-sqd-hpc",
    "fulqrum/test"
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = ["E741", "I001", "N999", "RUF022", "RUF100", 
          "SIM102", "SIM113", "SIM115", "SIM118", "TRY002"]
