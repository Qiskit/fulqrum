name: Testing
on:
  push:
    branches: [main]
  pull_request:
    branches: []
jobs:
  conda-test:
    name: ${{ matrix.os }} using Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      max-parallel: 5
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.15"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        conda info
        sudo apt-get install libblas-dev liblapack-dev
        # pyscf needs h5py, which has no cp315 wheel on PyPI yet.  Without
        # this, pip builds it from source and fails for want of HDF5.
        conda install -y -c conda-forge h5py
        pip install -U -r requirements.txt
        pip install -U -r requirements-dev.txt
    - name: Ruff lint and format
      run: |
        ruff check fulqrum
        ruff format fulqrum --check
    - name: Run tests with pytest
      run: |
        FQ_DEBUG=1 python setup.py build_ext --inplace
        pytest -p no:warnings --pyargs fulqrum/test
    - name: Run C++ tests
      run: |
        sh cpp-tests.sh
    - name: Build docs
      run: |
        conda install pandoc
        pip install .
        cd docs
        make html
